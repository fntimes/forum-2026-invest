---
title: 파트너
outputPath: partners/index.html
noHero: true
extraScripts:
---

  <main id="main-content">

    <!-- ============================================================
         1. 상단 배너 (초대의 글과 동일)
         ============================================================ -->
    <section class="forum-invitation-hero">
      <div class="forum-hero-bg" aria-hidden="true">
        <video autoplay muted loop playsinline
               data-src-desktop="/images/subhero_bg_loop.webm"></video>
      </div>
      <div class="forum-invitation-hero-inner">
        <div class="forum-invitation-title-block">
          <img class="forum-invitation-lockup" src="/images/subtitle_lockup.png"
               alt="2026 한국금융투자포럼 머니무브 × 2026 부의 공식 — 주식·부동산·코인 승자의 조건">
        </div>
        <p class="forum-hero-meta">
          <span>{{eventDate}}</span>
          <span class="sep">/</span>
          <span>{{eventPlace}}</span>
        </p>
      </div>
    </section>

    <!-- ============================================================
         2. 파트너
         ============================================================ -->
    <section class="forum-partners-page">
      <div class="forum-partners-page-inner">
        <h2 class="forum-section-title">파트너</h2>
        <p class="forum-partners-page-lead">금융과 산업의 혁신을 선도하는 기업들</p>

        <div class="forum-partners-page-images">
          <img alt="파트너 기업 1" class="forum-partners-page-image" src="/images/partners_01.jpg" />
          <img alt="파트너 기업 2" class="forum-partners-page-image" src="/images/partners_02.jpg" />
        </div>
      </div>
    </section>
  </main>
